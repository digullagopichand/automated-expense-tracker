apiVersion: v1
kind: Namespace
metadata:
  name: expense-tracker
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: expense-tracker-config
  namespace: expense-tracker
data:
  NODE_ENV: "production"
  PORT: "5000"
  DB_PATH: "/app/data/expense_tracker.sqlite"
  CORS_ORIGIN: "*"
  MAX_FILE_SIZE_MB: "5"
---
apiVersion: v1
kind: Secret
metadata:
  name: expense-tracker-secret
  namespace: expense-tracker
type: Opaque
stringData:
  JWT_SECRET: "k8s-production-automated-expense-tracker-jwt-secret-key-32chars"
