apiVersion: apps/v1
kind: Deployment
metadata:
  name: expense-tracker-frontend
  namespace: expense-tracker
  labels:
    app: expense-tracker
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: expense-tracker
      tier: frontend
  template:
    metadata:
      labels:
        app: expense-tracker
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: jvssiddhartha/automated-expense-tracker-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: expense-tracker-frontend
  namespace: expense-tracker
spec:
  type: ClusterIP
  selector:
    app: expense-tracker
    tier: frontend
  ports:
    - port: 80
      targetPort: 80
      name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: expense-tracker-ingress
  namespace: expense-tracker
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: expense-tracker-backend
                port:
                  number: 5000
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: expense-tracker-backend
                port:
                  number: 5000
          - path: /uploads
            pathType: Prefix
            backend:
              service:
                name: expense-tracker-backend
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: expense-tracker-frontend
                port:
                  number: 80
