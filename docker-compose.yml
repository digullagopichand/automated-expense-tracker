version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: expense-tracker-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=devops-automated-expense-tracker-jwt-secret-key-32chars
      - JWT_EXPIRES_IN=7d
      - DB_PATH=/app/data/expense_tracker.sqlite
      - CORS_ORIGIN=*
      - MAX_FILE_SIZE_MB=5
    ports:
      - "5000:5000"
    volumes:
      - expense_data:/app/data
      - expense_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - expense_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: expense-tracker-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - expense_network

volumes:
  expense_data:
    name: expense_tracker_data
  expense_uploads:
    name: expense_tracker_uploads

networks:
  expense_network:
    name: expense_tracker_network
    driver: bridge
